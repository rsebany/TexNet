[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ildexnet"
version = "0.1.0"
description = "ILD-TexNet: a compact texture network for ILD pattern classification on 32x32 HRCT patches"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Romualdo Sebany", email = "romualdosebany@gmail.com" }]
keywords = ["interstitial-lung-disease", "deep-learning", "pytorch", "texture", "medical-imaging"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.21",
  "torch>=2.0",
  "matplotlib>=3.5",
]

[project.scripts]
ildexnet = "ildexnet.cli:main"

[tool.setuptools.packages.find]
include = ["ildexnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]